{%block script%}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Ambil data dari context Django
    const statistikMusim = JSON.parse('{{ statistik_musim|escapejs }}');
    const statistikJenis = JSON.parse('{{ statistik_jenis|escapejs }}');
    const statistikLokasi = JSON.parse('{{ statistik_lokasi|escapejs }}');
    const rekomendasi = JSON.parse('{{ rekomendasi|escapejs }}');

    // Konversi data untuk Chart.js
    const musimLabels = statistikMusim.map(item => item.musim_tanam);
    const musimData = statistikMusim.map(item => item.total_panen);

    const jenisLabels = statistikJenis.map(item => item['tanaman__nama_tanaman']);
    const jenisData = statistikJenis.map(item => item.total_panen);

    const lokasiLabels = statistikLokasi.map(item => item.lokasi_lahan);
    const lokasiData = statistikLokasi.map(item => item.total_panen);

    const rekomendasiLabels = rekomendasi.map(item => `${item.musim} - ${item.tanaman}`);
    const rekomendasiData = rekomendasi.map(item => item.produktivitas);

    // Fungsi untuk membuat grafik batang
    function buatGrafikBar(canvasId, label, dataLabels, dataValues, warnaBar) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: dataLabels,
                datasets: [{
                    label: label,
                    data: dataValues,
                    backgroundColor: warnaBar,
                    borderColor: warnaBar.replace('0.8', '1'), // Warna lebih gelap untuk garis
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    // Buat grafik batang terpisah
    buatGrafikBar('grafikMusim', 'Statistik Panen per Musim', musimLabels, musimData, 'rgba(75, 192, 192, 0.8)');
    buatGrafikBar('grafikJenis', 'Statistik Panen per Jenis Tanaman', jenisLabels, jenisData, 'rgba(153, 102, 255, 0.8)');
    buatGrafikBar('grafikLokasi', 'Statistik Panen per Lokasi', lokasiLabels, lokasiData, 'rgba(255, 159, 64, 0.8)');
    buatGrafikBar('grafikRekomendasi', 'Rekomendasi Tanaman Produktif', rekomendasiLabels, rekomendasiData, 'rgba(255, 99, 132, 0.8)');
</script>
<!-- grafik -->
<script>
    const ctx = document.getElementById('grafikPerkembangan').getContext('2d');
    const grafikPerkembangan = new Chart(ctx, {
        type: 'line',
        data: {
            labels: {{ labels|safe }},
            datasets: [{
                label: 'Total Panen (kg)',
                data: {{ values|safe }},
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 2,
                fill: false,
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            layout: {
                padding: {
                    left: 0,
                    right: 0,
                    top: 0,
                    bottom: 0
                }
            },
            maintainAspectRatio: false
        }
    });
</script>
{%endblock script%}
